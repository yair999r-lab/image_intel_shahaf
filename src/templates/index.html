<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת חקירת תמונות - חיפוש</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .cyber-card {
            background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px);
            border: 1px solid #39ff14; border-radius: 15px; padding: 40px; width: 100%; max-width: 500px;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.15); text-align: center;
        }
        h1 { color: #39ff14; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; }
        .input-group { position: relative; margin-bottom: 25px; }
        .input-group i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #8b949e; }

        /* עיצוב שדה העלאת הקבצים */
        input[type="file"] {
            width: 100%; padding: 15px 45px 15px 15px; background: #010409; border: 1px solid #30363d;
            border-radius: 8px; color: #58a6ff; font-size: 16px; box-sizing: border-box; transition: 0.3s;
            cursor: pointer;
        }
        input[type="file"]:focus { border-color: #39ff14; outline: none; box-shadow: 0 0 10px rgba(57, 255, 20, 0.3); }

        /* עיצוב הכפתור הפנימי הלבן של בחירת הקבצים */
        input[type="file"]::file-selector-button {
            background-color: #0d1117;
            color: #39ff14;
            border: 1px solid #39ff14;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 15px;
            font-family: inherit;
            transition: 0.3s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #39ff14;
            color: #0d1117;
        }

        .cyber-btn {
            background: transparent; border: 2px solid #39ff14; color: #39ff14; padding: 15px 30px;
            font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; width: 100%;
        }
        .cyber-btn:hover:not(:disabled) { background: #39ff14; color: #0d1117; box-shadow: 0 0 15px #39ff14; }
        .cyber-btn:disabled { border-color: #444; color: #888; cursor: not-allowed; box-shadow: none; background: #222; }

        /* תוספת: עיצוב להודעה שמופיעה רק בנייד */
        #mobile-hint {
            font-size: 0.9em;
            color: #58a6ff;
            margin-top: -15px;
            margin-bottom: 20px;
            display: none; /* מוסתר כברירת מחדל */
        }
    </style>
</head>
<body>
    <div class="cyber-card">
        <h1><i class="fas fa-radar"></i> סורק מודיעין תמונות</h1>
        <p id="main-instruction" style="color: #8b949e; margin-bottom: 30px;">בחר תיקיית תמונות מהמחשב לתחילת סריקה פורנזית</p>

        <p id="mobile-hint"><i class="fas fa-mobile-alt"></i> זוהתה כניסה מנייד: ניתן לסמן מספר תמונות יחד מהגלריה.</p>

        <form action="/analyze" method="POST" id="scanForm" enctype="multipart/form-data">
            <div class="input-group">
                <i class="fas fa-folder-open" id="input-icon"></i>
                <input type="file" name="files" webkitdirectory directory multiple accept="image/*,.heic,.heif" required>
            </div>
            <button type="submit" class="cyber-btn" id="submitBtn">
                <i class="fas fa-search"></i> עבד נתונים
            </button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // בדיקה פשוטה: האם המשתמש גולש מטלפון נייד (אייפון או אנדרואיד)?
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            const fileInput = document.querySelector('input[type="file"]');
            const mobileHint = document.getElementById('mobile-hint');
            const mainInstruction = document.getElementById('main-instruction');
            const inputIcon = document.getElementById('input-icon');

            if (isMobile) {
                // אם זה נייד, אנחנו מסירים את דרישת ה"תיקייה" ששברה לאייפון את הקוד
                fileInput.removeAttribute('webkitdirectory');
                fileInput.removeAttribute('directory');

                // ומשנים את הטקסט והאייקון כדי שיתאימו לנייד
                mobileHint.style.display = 'block';
                mainInstruction.style.display = 'none';
                inputIcon.classList.remove('fa-folder-open');
                inputIcon.classList.add('fa-images');
            }
        });

        // כפתור הטעינה הרגיל
        document.getElementById('scanForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> מנתח נתונים, נא להמתין...';
            setTimeout(() => { btn.disabled = true; }, 10);
        });
    </script>
</body>
</html>
