<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שגיאת מערכת</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .error-card { background: rgba(30, 10, 10, 0.8); border: 1px solid #ff4444; border-radius: 15px; padding: 40px; text-align: center; box-shadow: 0 0 20px rgba(255, 68, 68, 0.2); }
        h1 { color: #ff4444; }
        .error-msg { background: #2a0a0a; padding: 15px; border-radius: 8px; color: #ff8888; font-family: monospace; margin: 20px 0; border: 1px dashed #ff4444; }
        .cyber-btn { background: transparent; border: 1px solid #58a6ff; color: #58a6ff; padding: 10px 20px; text-decoration: none; border-radius: 5px; transition: 0.3s; display: inline-block; }
        .cyber-btn:hover { background: #58a6ff; color: #000; box-shadow: 0 0 10px #58a6ff; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1><i class="fas fa-exclamation-triangle"></i> שגיאת סריקה</h1>
        <div class="error-msg">{{ error_msg }}</div>
        <a href="/" class="cyber-btn"><i class="fas fa-arrow-right"></i> חזור למערכת החיפוש</a>
    </div>
</body>
</html>
